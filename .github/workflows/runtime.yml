name: runtime

# Per-PR build, test, clippy, and fmt for the deterministic runtime
# crate. Triggers only on changes that affect the runtime or that its tests
# read — the command files, the shipped rule files, and the paths listed
# below. Other spec or framework edits stay on the markdown-only path's
# workflow.

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'framework/commands/*.md'
      - '.github/workflows/runtime.yml'
      # A packaging change in the release workflow re-runs the portability
      # check below, which mirrors that sequence (spec 048, task 3).
      - '.github/workflows/runtime-release.yml'
      # tests/mechanical_sweep_parity.rs runs Family 19's own rule and
      # compares it with the Rust one, so an edit to the family is an edit
      # to this suite's subject. Without this path a change there breaks the
      # comparison and nothing notices until an unrelated runtime commit
      # happens to trigger the workflow.
      - 'scripts/audit/review-freshness.sh'
      # src/primitives/rule_sections.rs holds corpus tests over the shipped
      # rule files (every rule assessable, no Statement mixing tiers), so an
      # edit to a rule file is an edit to their subject. Without this path a
      # rules-only change never runs them.
      - 'framework/rules/**'
      # src/schema/config_keys.rs holds the installer's §Project Configuration
      # to the registry of recognized config keys (spec 019), so an edit to
      # that section is an edit to the test's subject.
      - 'framework/bootstrap/ductus.md'
  push:
    branches:
      - main
    paths:
      - 'runtime/**'
      - 'framework/commands/*.md'
      - '.github/workflows/runtime.yml'
      - '.github/workflows/runtime-release.yml'
      - 'scripts/audit/review-freshness.sh'
      - 'framework/rules/**'
      - 'framework/bootstrap/ductus.md'

permissions:
  contents: read

jobs:
  # Build + test on every OS the release workflow ships binaries for.
  # fmt + clippy stay Linux-only in the lint job below — their output is
  # platform-independent, so tripling them buys nothing.
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: runtime
    steps:
      # fetch-depth: 0 — `tests/mechanical_sweep_parity.rs` resolves every
      # done spec's `reviewed-against` sha, from its review.md, and diffs it against HEAD,
      # comparing the Rust staleness rule with /ductus:audit Family 19's. The
      # default single-commit checkout has none of those commits, so the test
      # finds nothing to compare and fails its own vacuity guard rather than
      # passing on an empty set. Same requirement Family 19's job carries in
      # runtime-release.yml, and the same one AGENTS.md records after
      # gvrn-v0.27.1 blocked its own publish on it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned — keep in sync with runtime/rust-toolchain.toml.
      # `components` must match the toolchain file: any cargo command run
      # under runtime/ makes rustup honor rust-toolchain.toml, and if the
      # declared components are missing it auto-installs them mid-build —
      # a path that hits rustup's "detected conflict: 'bin/cargo-fmt'" bug.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-runtime-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-runtime-

      - name: cargo build --release --locked
        run: cargo build --release --locked

      - name: cargo test --release --locked
        run: cargo test --release --locked

      # Packaging portability (spec 048, task 3). The release workflow packages
      # every platform as `.tar.gz` and verifies the digest with whichever of
      # `shasum` / `sha256sum` the image provides — but it runs only on a
      # pushed `ductus-v*` tag, so until now the Windows leg of that sequence
      # could not be exercised before the release it was meant to protect.
      # That is the wrong moment to discover Git Bash lacks a tool.
      #
      # This runs the identical sequence against the ordinary release build on
      # all three images: package, verify, extract, execute. It proves the
      # portability, not the artifact — the release workflow still produces
      # and verifies the real assets.
      - name: Packaging portability (tar + checksum + extract)
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          [ "${{ matrix.os }}" = "windows-latest" ] && ext=".exe"
          cd target/release
          archive="ductus-packaging-probe.tar.gz"
          tar -czf "$archive" "ductus${ext}"
          if command -v shasum > /dev/null; then
            shasum -a 256 "$archive" > "${archive}.sha256"
            shasum -a 256 -c "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
            sha256sum -c "${archive}.sha256"
          fi
          probe="$(mktemp -d)"
          tar -xzf "$archive" -C "$probe"
          test -f "$probe/ductus${ext}"
          "$probe/ductus${ext}" --version
          rm "$archive" "${archive}.sha256"

  # Dependency vulnerability scan (BE-DEPS-001). Fails on any RUSTSEC
  # advisory affecting the resolved Cargo.lock graph; a deliberate
  # exception requires an `[advisories] ignore` entry in
  # runtime/audit.toml with a justification comment naming the RUSTSEC
  # id and the revisit condition.
  audit:
    name: cargo audit (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned — keep in sync with runtime/rust-toolchain.toml (see the
      # components note on the build-and-test job above).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      # Prebuilt binary — a cargo install would recompile cargo-audit on
      # every cold cache and dominate the job's wall-clock.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit

  lint:
    name: fmt + clippy (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned — keep in sync with runtime/rust-toolchain.toml (see the
      # components note on the build-and-test job above).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-runtime-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-runtime-

      # `cargo fmt` does no dependency resolution, so `--locked` does not
      # apply to it (cargo-fmt rejects the flag).
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --release --all-targets --locked -- -D warnings
        run: cargo clippy --release --all-targets --locked -- -D warnings
