name: generators

on:
  pull_request:
    paths:
      - 'framework/**'
      - 'specs/**'
      - 'scripts/gen-*.sh'
      - 'runtime/src/primitives/derive_*.rs'
      - 'scripts/tests/**'
      - 'AGENTS.md'
      - '.githooks/**'
      - '.github/workflows/generators.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Generators are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The two frontmatter derivations are runtime primitives since spec 022's
      # adopter-generator-promotion, so this workflow now needs the binary.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-generators-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-generators-
      - name: Build the runtime
        run: cd runtime && cargo build --release --locked --quiet

      - name: Run gen-configure-mcp
        run: ./scripts/gen-configure-mcp.sh

      - name: Run gen-claude-commands
        run: ./scripts/gen-claude-commands.sh

      - name: Run gen-help-tables
        run: ./scripts/gen-help-tables.sh

      - name: Derive spec dependencies
        run: ./runtime/target/release/ductus derive-dependencies --write

      - name: Derive cross-service references
        run: ./runtime/target/release/ductus derive-references --write

      - name: Fail if any generator produced a diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generator outputs are out of date. Run scripts/install-hooks.sh and re-commit."
            exit 1
          fi


