name: generators

on:
  pull_request:
    paths:
      - 'framework/**'
      - 'specs/**'
      - 'scripts/gen-*.sh'
      - 'runtime/src/primitives/derive_*.rs'
      - 'scripts/tests/**'
      - 'AGENTS.md'
      - '.githooks/**'
      - '.github/workflows/generators.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Generators are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The two frontmatter derivations are runtime primitives since spec 067's
      # adopter-generator-promotion, so this workflow now needs the binary.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-generators-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-generators-
      - name: Build the runtime
        run: cd runtime && cargo build --release --locked --quiet

      - name: Run gen-configure-mcp
        run: ./scripts/gen-configure-mcp.sh

      - name: Run gen-claude-commands
        run: ./scripts/gen-claude-commands.sh

      - name: Run gen-help-tables
        run: ./scripts/gen-help-tables.sh

      - name: Derive spec dependencies
        run: ./runtime/target/release/ductus derive-dependencies --write

      - name: Derive cross-service references
        run: ./runtime/target/release/ductus derive-references --write

      - name: Fail if any generator produced a diff
        run: |
          # `git diff --exit-code` compares tracked files only, so a generator
          # that creates a *new* output left this step reporting "in sync" over
          # a tree that was not: adding a command source under
          # framework/commands/ makes gen-claude-commands.sh write a new
          # .claude/commands/ductus/ copy, and an untracked file is invisible to
          # `git diff`. `git status --porcelain` covers untracked paths too, so
          # the clean result means what it says (QUAL-CLAIM-001).
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::Generator outputs are out of date. Run scripts/install-hooks.sh and re-commit."
            printf '%s\n' "$dirty"
            git diff
            exit 1
          fi


