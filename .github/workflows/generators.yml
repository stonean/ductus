name: generators

on:
  pull_request:
    paths:
      - 'framework/**'
      - 'specs/**'
      - 'scripts/gen-*.sh'
      # The generators run the release build: derive-dependencies,
      # derive-references, and apply-manifest, which reaches the parser, the
      # registry, the citation rules and the host checks (spec 080). Any runtime
      # source or dependency can move their output, and a list of the files
      # they reach would go stale.
      - 'runtime/src/**'
      - 'runtime/Cargo.lock'
      - 'runtime/Cargo.toml'
      - 'scripts/tests/**'
      - 'AGENTS.md'
      - '.githooks/**'
      - '.github/workflows/generators.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Generators are in sync
    runs-on: ubuntu-latest
    # Bounds the whole job (BE-TIMEOUT-001): four times the longest
    # successful run among its 15 most recent (3.1 min, measured 2026-10-29),
    # rounded up to a whole five minutes, as 022's plan sizes every job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The two frontmatter derivations are runtime primitives since spec 067's
      # adopter-generator-promotion, so this workflow now needs the binary.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      # Keyed on what the binary is compiled from, so an unchanged runtime
      # restores a build of exactly these sources (spec 081). runtime/src holds
      # no include_str! or include_bytes!, and the crate has no build.rs.
      - id: runtime-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-generators-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml', 'runtime/rust-toolchain.toml', 'runtime/src/**') }}
          restore-keys: |
            ${{ runner.os }}-generators-
      # The checkout gives every source a newer mtime than the restored build,
      # which cargo reads as a change. On an exact hit that build is of these
      # very sources, so dating them back lets every `cargo build` in this job
      # find it fresh, and a spec-only push compiles nothing. Never on a
      # fallback restore: that build is of other sources, and dating those back
      # would hand the steps a stale binary.
      - name: Reuse the cached build of these runtime sources
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: git ls-files -z runtime | xargs -0 touch -t 200001010000
      - name: Build the runtime
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "No build of these runtime sources is cached, so this run compiles one."
          fi
          cd runtime && cargo build --release --locked --quiet

      - name: Run gen-configure-mcp
        run: ./scripts/gen-configure-mcp.sh

      # Before the generator runs: a runtime that predates tool-search-line
      # must halt it (spec 080, task 26). The test runs it from a scratch copy
      # of the tree, so it leaves nothing for the in-sync check below, and its
      # last case reads the release build the step above made.
      - name: Test gen-claude-commands' runtime check
        run: bash scripts/tests/test-gen-claude-commands.sh

      - name: Run gen-claude-commands
        run: ./scripts/gen-claude-commands.sh

      - name: Run gen-help-tables
        run: ./scripts/gen-help-tables.sh

      - name: Derive spec dependencies
        run: ./runtime/target/release/ductus derive-dependencies --write

      - name: Derive cross-service references
        run: ./runtime/target/release/ductus derive-references --write

      - name: Fail if any generator produced a diff
        run: |
          # `git diff --exit-code` compares tracked files only, so a generator
          # that creates a *new* output left this step reporting "in sync" over
          # a tree that was not: adding a command source under
          # framework/commands/ makes gen-claude-commands.sh write a new
          # .claude/commands/ductus/ copy, and an untracked file is invisible to
          # `git diff`. `git status --porcelain` covers untracked paths too, so
          # the clean result means what it says (QUAL-CLAIM-001).
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::Generator outputs are out of date. Run scripts/install-hooks.sh and re-commit."
            echo "::error::If a committed generated copy (.claude/commands/, .pi/, .ductus/reference/, the configure files, help.md) is ahead of its source, the pre-commit hook built it from an unstaged source edit — commit that source too."
            printf '%s\n' "$dirty"
            git diff
            exit 1
          fi


