name: runtime-release

# Tag-triggered cross-compile + GitHub release upload for the
# deterministic runtime binary. Tag scheme: ductus-v<MAJOR>.<MINOR>.<PATCH>.
# Releases before 0.28.0 were tagged gvrn-v*; those tags and their assets are
# left exactly as published (spec 049).
# The release notes are sourced from runtime/CHANGELOG.md.

on:
  push:
    tags:
      - 'ductus-v*'

permissions:
  contents: write

jobs:
  # Framework self-audit (spec 026) — runs before the build matrix as a
  # pre-tag gate. The v1 advisories (Family 4, 8, 9) were resolved in
  # commit 1aca768. Per spec 026 §Q4 and the audit-ci-hard-gate
  # scenario, this job is now a hard release gate: any finding aborts
  # the release. To deliberately allow a finding, use the documented
  # ignore-marker annotations inside the affected source.
  audit:
    name: Framework self-audit
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the self-audit's Family 19 (review-freshness) resolves
      # each spec's `review.reviewed-against` sha against history. A shallow
      # clone has none of those commits, so every spec reports "not a commit in
      # this repo" and the gate fails for a reason unrelated to review freshness
      # (observed on gvrn-v0.27.1, which blocked its own publish).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run /audit
        run: bash scripts/audit/run-all.sh

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            ext: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      # Pinned — keep in sync with runtime/rust-toolchain.toml.
      # `components` must match the toolchain file: any cargo command run
      # under runtime/ makes rustup honor rust-toolchain.toml, and if the
      # declared components are missing it auto-installs them mid-build —
      # a path that hits rustup's "detected conflict: 'bin/cargo-fmt'" bug.
      # Pre-installing them here keeps that auto-install path from running.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Install cargo-zigbuild (cross builds)
        if: matrix.cross
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross-compiled via cargo-zigbuild)
        if: matrix.cross
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Smoke test --version
        if: matrix.os != 'ubuntu-latest' || !matrix.cross
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/ductus${{ matrix.ext }} --version

      # One archive format on every platform. Windows published `.zip` until
      # spec 048; `.tar.gz` everywhere means acquisition extracts with `tar`
      # on every platform, so `unzip` never enters any agent's permission
      # grammar. Windows 10+ ships bsdtar as `tar`, and `tar` is already
      # granted in all four bootstrap seeds.
      #
      # `shell: bash` on Windows is Git Bash, which supplies tar and shasum —
      # so this is one step rather than a per-OS pair. The archived binary
      # keeps its platform name (`ductus.exe` on Windows), which acquisition
      # relies on when it installs into the store.
      - name: Package (tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          archive="ductus-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" "ductus${{ matrix.ext }}"
          # No single checksum command spans the three runner images: macOS
          # ships `shasum` and not `sha256sum`, Git Bash on windows-latest
          # ships coreutils `sha256sum`, Linux has both. Probe rather than
          # assume — the two produce byte-identical `<hash>  <file>` output,
          # so the sidecar format is one format on every platform.
          #
          # It did not used to be. Windows packaged with `Get-FileHash`, whose
          # output is a bare uppercase hash with no filename, so the sidecar
          # format silently differed by platform. Acquisition parses these,
          # so unifying the producer is what lets the consumer have one rule.
          if command -v shasum > /dev/null; then
            shasum -a 256 "$archive" > "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"

      # Prove the archive is usable on the platform that produced it, rather
      # than assuming it. This is the same sequence acquisition performs in an
      # adopter's bootstrap — verify the digest, extract with `tar`, execute
      # the binary — so a packaging change that breaks acquisition fails here,
      # on the release that introduced it, instead of in someone's first
      # `/ductus` run. It is the only place the Windows path can be exercised:
      # the release workflow is the only job that runs on windows-latest.
      - name: Verify the archive extracts and runs
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          archive="ductus-${{ matrix.target }}.tar.gz"
          if command -v shasum > /dev/null; then
            shasum -a 256 -c "${archive}.sha256"
          else
            sha256sum -c "${archive}.sha256"
          fi
          probe="$(mktemp -d)"
          tar -xzf "$archive" -C "$probe"
          test -f "$probe/ductus${{ matrix.ext }}"
          # A cross-compiled binary cannot execute on the builder, matching
          # the existing smoke test's condition.
          if [ "${{ matrix.cross }}" != "true" ]; then
            "$probe/ductus${{ matrix.ext }}" --version
          fi

      # Assets are STAGED as workflow artifacts, never uploaded to the release
      # from inside the matrix. `fail-fast: false` (deliberate — every target's
      # failure must be visible in one run) means a failing leg would otherwise
      # leave the release published with the other four assets and nothing
      # saying so. Spec 048 makes the runtime required, so a platform missing
      # its asset locks those adopters out of the pipeline entirely; the
      # release-assets job below publishes only once the set is complete.
      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.target }}
          path: |
            runtime/target/${{ matrix.target }}/release/ductus-${{ matrix.target }}.tar.gz
            runtime/target/${{ matrix.target }}/release/ductus-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # The publish gate: every target's assets are present, or the release gets
  # none of them. `needs: build` already skips this job when a matrix leg
  # fails outright; the explicit manifest below additionally catches a leg
  # that SUCCEEDED without producing its asset, which the job graph cannot
  # see. Spec 048, task 2.
  #
  # REQUIRED_TARGETS must match the build matrix. Drift in the safe direction
  # (a target added to the matrix but not here) publishes an extra asset;
  # drift in the dangerous direction (a target dropped from the matrix) fails
  # this gate loudly, which is the direction that matters.
  release-assets:
    name: Publish release assets (complete set only)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_TARGETS: >-
        aarch64-apple-darwin
        x86_64-apple-darwin
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-pc-windows-msvc
    steps:
      - name: Download staged assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: staged
          merge-multiple: true

      - name: Assert the asset set is complete
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for target in $REQUIRED_TARGETS; do
            archive="staged/ductus-${target}.tar.gz"
            if [ ! -f "$archive" ]; then
              echo "::error::no release archive for ${target}"
              missing=1
              continue
            fi
            if [ ! -f "${archive}.sha256" ]; then
              echo "::error::${archive} has no .sha256 sidecar"
              missing=1
              continue
            fi
            echo "ok: $(basename "$archive") + sidecar"
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release withheld — the asset set is incomplete."
            echo "A partial release locks out every adopter on the missing platform."
            exit 1
          fi

      - name: Upload the complete set to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            staged/*.tar.gz
            staged/*.tar.gz.sha256

  # CycloneDX SBOM (BE-DEPS-003) — generated during the release build
  # from the resolved Cargo.lock graph and attached to the same release.
  # The graph is identical across the target matrix, so one SBOM covers
  # every artifact; attached to the release, it shares the artifacts'
  # retention lifetime.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7

      # Pinned — keep in sync with runtime/rust-toolchain.toml.
      # `components` must match the toolchain file (see build job above).
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      # --override-filename pins the output name (it replaces the whole
      # stem, so the .cdx convention must be part of the value); the
      # default naming has varied across cargo-cyclonedx versions.
      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --override-filename ductus.cdx
          shasum -a 256 ductus.cdx.json > ductus.cdx.json.sha256

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            runtime/ductus.cdx.json
            runtime/ductus.cdx.json.sha256

  publish:
    name: Publish to crates.io
    # Also gated on release-assets: publishing the crate while the GitHub
    # release carries no downloadable binaries would leave the two halves of
    # one release disagreeing about whether it happened (spec 048, task 2).
    needs: [audit, build, release-assets]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      # Pinned — keep in sync with runtime/rust-toolchain.toml.
      # `components` must match the toolchain file (see build job above).
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
