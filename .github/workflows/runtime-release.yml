name: runtime-release

# Tag-triggered cross-compile + GitHub release upload for the
# deterministic runtime binary. Tag scheme: ductus-v<MAJOR>.<MINOR>.<PATCH>.
# Releases before 0.28.0 were tagged gvrn-v*; those tags and their assets are
# left exactly as published (spec 049).
# The release notes are sourced from runtime/CHANGELOG.md.
#
# Job order is load-bearing and reads top to bottom:
#   audit ─┐
#          ├─→ acquire ─→ sbom ─→ publish ─→ release-assets
#   build ─┘
# The crate publishes BEFORE the GitHub release is created. See the
# release-assets comment at the bottom for why that direction and not the
# other one (spec 048, scenarios/release-halves-publish-together.md).

on:
  push:
    tags:
      - 'ductus-v*'

permissions:
  contents: write

jobs:
  # Framework self-audit (spec 026) — runs before the build matrix as a
  # pre-tag gate. The v1 advisories (Family 4, 8, 9) were resolved in
  # commit 1aca768. Per spec 026 §Q4 and the audit-ci-hard-gate
  # scenario, this job is now a hard release gate: any finding aborts
  # the release. To deliberately allow a finding, use the documented
  # ignore-marker annotations inside the affected source.
  audit:
    name: Framework self-audit
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the self-audit's Family 19 (review-freshness) resolves
      # each spec's `review.reviewed-against` sha against history. A shallow
      # clone has none of those commits, so every spec reports "not a commit in
      # this repo" and the gate fails for a reason unrelated to review freshness
      # (observed on gvrn-v0.27.1, which blocked its own publish).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run /audit
        run: bash scripts/audit/run-all.sh

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            ext: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7

      # Pinned — keep in sync with runtime/rust-toolchain.toml.
      # `components` must match the toolchain file: any cargo command run
      # under runtime/ makes rustup honor rust-toolchain.toml, and if the
      # declared components are missing it auto-installs them mid-build —
      # a path that hits rustup's "detected conflict: 'bin/cargo-fmt'" bug.
      # Pre-installing them here keeps that auto-install path from running.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Install cargo-zigbuild (cross builds)
        if: matrix.cross
        run: |
          pip3 install ziglang
          cargo install --locked cargo-zigbuild

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross-compiled via cargo-zigbuild)
        if: matrix.cross
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Smoke test --version
        if: matrix.os != 'ubuntu-latest' || !matrix.cross
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/ductus${{ matrix.ext }} --version

      # One archive format on every platform. Windows published `.zip` until
      # spec 048; `.tar.gz` everywhere means acquisition extracts with `tar`
      # on every platform, so `unzip` never enters any agent's permission
      # grammar. Windows 10+ ships bsdtar as `tar`, and `tar` is already
      # granted in all four bootstrap seeds.
      #
      # `shell: bash` on Windows is Git Bash, which supplies tar and shasum —
      # so this is one step rather than a per-OS pair. The archived binary
      # keeps its platform name (`ductus.exe` on Windows), which acquisition
      # relies on when it installs into the store.
      - name: Package (tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          archive="ductus-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" "ductus${{ matrix.ext }}"
          # No single checksum command spans the three runner images: macOS
          # ships `shasum` and not `sha256sum`, Git Bash on windows-latest
          # ships coreutils `sha256sum`, Linux has both. Probe rather than
          # assume — the two produce byte-identical `<hash>  <file>` output,
          # so the sidecar format is one format on every platform.
          #
          # It did not used to be. Windows packaged with `Get-FileHash`, whose
          # output is a bare uppercase hash with no filename, so the sidecar
          # format silently differed by platform. Acquisition parses these,
          # so unifying the producer is what lets the consumer have one rule.
          if command -v shasum > /dev/null; then
            shasum -a 256 "$archive" > "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"

      # Prove the archive is usable on the platform that produced it, rather
      # than assuming it. This is the same sequence acquisition performs in an
      # adopter's bootstrap — verify the digest, extract with `tar`, execute
      # the binary — so a packaging change that breaks acquisition fails here,
      # on the release that introduced it, instead of in someone's first
      # `/ductus` run. It is the only place the Windows path can be exercised:
      # the release workflow is the only job that runs on windows-latest.
      - name: Verify the archive extracts and runs
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          archive="ductus-${{ matrix.target }}.tar.gz"
          if command -v shasum > /dev/null; then
            shasum -a 256 -c "${archive}.sha256"
          else
            sha256sum -c "${archive}.sha256"
          fi
          probe="$(mktemp -d)"
          tar -xzf "$archive" -C "$probe"
          test -f "$probe/ductus${{ matrix.ext }}"
          # A cross-compiled binary cannot execute on the builder, matching
          # the existing smoke test's condition.
          if [ "${{ matrix.cross }}" != "true" ]; then
            "$probe/ductus${{ matrix.ext }}" --version
          fi

      # Assets are STAGED as workflow artifacts, never uploaded to the release
      # from inside the matrix. `fail-fast: false` (deliberate — every target's
      # failure must be visible in one run) means a failing leg would otherwise
      # leave the release published with the other four assets and nothing
      # saying so. Spec 048 makes the runtime required, so a platform missing
      # its asset locks those adopters out of the pipeline entirely; the
      # release-assets job below publishes only once the set is complete.
      #
      # retention-days outlives one pipeline run on purpose. These artifacts
      # used to be consumed minutes later, by a release-assets job that ran
      # right after this one. They are now consumed by the LAST job in the
      # chain, and the documented recovery from a failed publish is to fix the
      # cause and re-run — which took a token rotation on ductus-v0.30.0. A
      # one-day retention would make "re-run tomorrow" fail on expired
      # artifacts rather than on the thing that actually broke.
      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.target }}
          path: |
            runtime/target/${{ matrix.target }}/release/ductus-${{ matrix.target }}.tar.gz
            runtime/target/${{ matrix.target }}/release/ductus-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # The **acquisition invariant** from constitution §runtime-boundary, run
  # against the assets this pipeline just built — fetch, verify the sidecar
  # digest, install, and execute, on a runner that natively matches each
  # target.
  #
  # It reads the STAGED artifacts rather than a release download URL, because
  # by design no GitHub release exists yet when this runs (see release-assets
  # at the bottom). The bytes are the same bytes: release-assets uploads these
  # staged artifacts unmodified. What this job no longer covers on its own is
  # the upload itself — `runtime-acquisition.yml` is the hand-dispatchable
  # copy that fetches from the published URL when a release needs
  # re-validating after the fact.
  #
  # It also subsumes the asset-completeness gate for everything downstream:
  # the matrix names all five targets and each leg downloads its own staged
  # artifact by exact name, so a target that produced no asset fails here —
  # before `publish`, before anything is irreversible.
  #
  # It lives in this workflow rather than in its own `on: release: [published]`
  # workflow because GitHub does not trigger workflows from events created with
  # the default GITHUB_TOKEN. A standalone workflow would have looked correct,
  # been referenced by the constitution, and never once run.
  #
  # `publish` depends on this: an adopter acquires the release assets, not
  # the crate, so shipping a crate whose binaries cannot be fetched and run
  # would publish the half nobody uses and skip the half everybody does.
  acquire:
    name: Acquire ${{ matrix.target }}
    needs: [audit, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Natively-matching runners: this job executes what it installs,
        # which is the half of acquisition a digest check cannot prove. That
        # is why it differs from the build matrix above, which cross-compiles
        # two targets and never runs them.
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Executed on Apple Silicon under Rosetta 2 rather than on native
          # Intel: GitHub has retired its Intel macOS images, and the
          # macos-13 label this used to name never picks up a runner — the
          # job sits queued until it times out, which reads as a hang rather
          # than a missing runner. Rosetta proves the binary loads and runs;
          # it does not prove native Intel execution, and nothing available
          # here can.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      # By exact name, not by pattern: this leg must fail when ITS target
      # staged nothing, rather than quietly proceeding on another target's
      # assets.
      - name: Download the staged assets for this target
        uses: actions/download-artifact@v4
        with:
          name: release-asset-${{ matrix.target }}
          path: staged

      - name: Verify, install, execute
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version)"
          target="${{ matrix.target }}"
          archive="ductus-${target}.tar.gz"

          store="$(mktemp -d)/store"
          staging="$(mktemp -d)"
          # A missing sidecar is a failure here, not a skip: release assets
          # always carry theirs, so `cp` failing is the correct outcome.
          cp "staged/${archive}" "staged/${archive}.sha256" "$staging/"
          cd "$staging"

          # Verify BEFORE installing anything.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${archive}.sha256"
          else
            shasum -a 256 -c "${archive}.sha256"
          fi

          mkdir -p "$store"
          tar -xzf "$archive"
          binary="ductus"
          [ "$target" = "x86_64-pc-windows-msvc" ] && binary="ductus.exe"
          mv "$binary" "$store/$binary"
          chmod +x "$store/$binary"

          # Execute it: a binary that installs but will not run is an
          # acquisition failure, which is why the probe runs it rather than
          # reading a recorded marker.
          reported="$("$store/$binary" --version)"
          echo "reported: $reported"
          case "$reported" in
            *"$version"*) ;;
            *)
              echo "::error::installed binary reports '$reported', expected $version"
              exit 1
              ;;
          esac

  # CycloneDX SBOM (BE-DEPS-003) — generated during the release build
  # from the resolved Cargo.lock graph and shipped with the same release.
  # The graph is identical across the target matrix, so one SBOM covers
  # every artifact; attached to the release, it shares the artifacts'
  # retention lifetime.
  sbom:
    name: SBOM (CycloneDX)
    # Staged as a workflow artifact and uploaded by release-assets, NOT
    # uploaded here. Uploading to a release creates the release object when it
    # does not exist, so a job that attaches an SBOM directly is a job that can
    # bring the release into being ahead of everything gating it. That is not
    # hypothetical: on the first ductus-v0.28.0 attempt — audit failed, no
    # binaries published — the tag still had a GitHub release carrying nothing
    # but an SBOM. A release with no runtime in it is worse than no release: it
    # reads as published to anyone looking, and to the acquisition job. With
    # the release now created last, staging is what keeps that true.
    needs: acquire
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7

      # Pinned — keep in sync with runtime/rust-toolchain.toml.
      # `components` must match the toolchain file (see build job above).
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      # --override-filename pins the output name (it replaces the whole
      # stem, so the .cdx convention must be part of the value); the
      # default naming has varied across cargo-cyclonedx versions.
      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --override-filename ductus.cdx
          shasum -a 256 ductus.cdx.json > ductus.cdx.json.sha256

      # `release-asset-*` so release-assets' merge-multiple download collects
      # it alongside the five platform archives; same retention as those, for
      # the same re-run reason.
      - name: Stage the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-sbom
          path: |
            runtime/ductus.cdx.json
            runtime/ductus.cdx.json.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to crates.io
    # The first irreversible act in the pipeline, and deliberately the first
    # one attempted: a published crate version can be yanked but never
    # unpublished, while a GitHub release can be deleted and recreated. See
    # release-assets below.
    #
    # Every gate that guarded this publish before the reordering still guards
    # it. `audit` and `build` are listed even though `acquire` already implies
    # them, so the gate set is readable here rather than reconstructed from
    # the graph.
    #
    # `sbom` is one of them because BE-DEPS-003 requires every production
    # artifact to ship with a machine-readable bill of materials. On
    # ductus-v0.29.9 the SBOM upload hit a transient GitHub 5xx, the job
    # failed, and the crates.io publish went ahead regardless — sbom was a
    # sibling of publish rather than a dependency, so the release sat with ten
    # binaries and no SBOM until the failed job was re-run by hand. A job that
    # reads like a gate for something that does not depend on it is the same
    # defect this file already carried once, when release-assets needed only
    # build.
    #
    # Re-running this job for a version already on crates.io fails with "crate
    # version already uploaded". That is safe — it is not a partial write —
    # but the failure is indistinguishable from a real one without reading the
    # log.
    needs: [audit, build, acquire, sbom]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v7
      # Pinned — keep in sync with runtime/rust-toolchain.toml.
      # `components` must match the toolchain file (see build job above).
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # The GitHub release — created LAST, once the crate is on crates.io.
  #
  # A release has two halves and nothing makes them atomic: the GitHub release
  # carrying the platform binaries, and the crates.io publish carrying the
  # source crate. This job used to run first, so a failed `cargo publish` left
  # a downloadable release whose crate did not exist — inconsistent in the
  # direction that is hardest to notice, because the GitHub release is the half
  # adopters see and nothing downstream complains. It happened three times:
  # ductus-v0.29.9 (the SBOM upload hit a transient 5xx), then ductus-v0.30.0
  # and ductus-v0.31.0 on 2026-08-19 (an expired CARGO_REGISTRY_TOKEN, 403
  # Forbidden on both; each needed a manual re-run, and 0.31.0 needed a second
  # one because Actions resolves secrets at job start, so rotating the token
  # mid-run does not reach a job already in flight).
  #
  # crates.io is the irreversible half, so it is attempted first. Ordering does
  # not make the two transactional — nothing can, across two registries. The
  # narrower claim is the one worth holding: the recoverable half is the only
  # one that can be left undone, and a failed release now leaves nothing
  # user-visible at all. The inverse split (crate published, this job fails) is
  # strictly better than what it replaces: its inputs are already-built
  # artifacts and re-running it is cheap, whereas a missing publish for an
  # already-tagged version is the case that needed manual re-runs.
  # Spec 048, scenarios/release-halves-publish-together.md.
  #
  # The manifest below is belt-and-suspenders, not the completeness gate: that
  # is `acquire`, which fails before `publish` when a target staged nothing.
  # What this catches is the narrower case of an artifact that vanished between
  # the two, and it keeps the job honest about uploading a complete set or
  # none.
  #
  # REQUIRED_TARGETS must match the build matrix. Drift in the safe direction
  # (a target added to the matrix but not here) publishes an extra asset;
  # drift in the dangerous direction (a target dropped from the matrix) fails
  # this gate loudly, which is the direction that matters.
  release-assets:
    name: Publish release assets (complete set only)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_TARGETS: >-
        aarch64-apple-darwin
        x86_64-apple-darwin
        x86_64-unknown-linux-gnu
        aarch64-unknown-linux-gnu
        x86_64-pc-windows-msvc
    steps:
      - name: Download staged assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          path: staged
          merge-multiple: true

      - name: Assert the asset set is complete
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for target in $REQUIRED_TARGETS; do
            archive="staged/ductus-${target}.tar.gz"
            if [ ! -f "$archive" ]; then
              echo "::error::no release archive for ${target}"
              missing=1
              continue
            fi
            if [ ! -f "${archive}.sha256" ]; then
              echo "::error::${archive} has no .sha256 sidecar"
              missing=1
              continue
            fi
            echo "ok: $(basename "$archive") + sidecar"
          done
          # BE-DEPS-003: the SBOM ships with the artifacts it describes. It
          # is staged by the sbom job rather than attached there, so its
          # absence is this job's to catch.
          if [ ! -f "staged/ductus.cdx.json" ] || [ ! -f "staged/ductus.cdx.json.sha256" ]; then
            echo "::error::no SBOM or SBOM sidecar among the staged assets"
            missing=1
          else
            echo "ok: ductus.cdx.json + sidecar"
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::release withheld — the asset set is incomplete."
            echo "A partial release locks out every adopter on the missing platform."
            exit 1
          fi

      - name: Upload the complete set to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            staged/*.tar.gz
            staged/*.tar.gz.sha256
            staged/ductus.cdx.json
            staged/ductus.cdx.json.sha256
