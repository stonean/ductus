name: windows-agent-session

# Spec 048, task 32 (owner decision, 2026-11-16): one State B bootstrap in a
# real agent session on Windows. Claude Code runs `/ductus` under Git Bash on a
# scratch adopter with no runtime live in the session, so the bootstrap writes
# `apply-manifest`'s and `enforce-manifest`'s `--*-json` files into its
# `{tempdir}` with the host's own write tool and passes them to the CLI. No
# other run reaches that composition: the runtime's tests write those files
# themselves, and no maintainer has a Windows machine with an agent.
#
# Run by hand only (`gh workflow run windows-agent-session.yml`), never on a
# push: each run is one bootstrap's model requests, billed to the
# ANTHROPIC_API_KEY repository secret. The scratch adopter's `[runtime] path`
# names this run's release build, since `--ref=main` pins the last release and
# main's bootstrap calls primitives that release lacks.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-b-bootstrap:
    name: State B bootstrap in Claude Code (windows-latest)
    runs-on: windows-latest
    # Bounds the whole job (BE-TIMEOUT-001): a cached release build, the
    # Claude Code install, and the session, which its own step bounds.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned — keep in sync with runtime/rust-toolchain.toml, as in
      # runtime.yml's build-and-test, whose comment says why `components` is
      # listed.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-runtime-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-runtime-

      - name: cargo build --release --locked
        working-directory: runtime
        run: cargo build --release --locked

      # Pinned to the version this workflow was written against; Node is the
      # runner image's own.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.325

      # A git repository with the inputs the bootstrap would ask for already
      # recorded, so a session with no operator has nothing to wait on, and the
      # bootstrap installed by main's installer.
      - name: Prepare the scratch adopter
        shell: bash
        run: |
          set -euo pipefail
          subj="$(cygpath -u "$RUNNER_TEMP")/adopter"
          bin="$(cygpath -m "$GITHUB_WORKSPACE/runtime/target/release/ductus.exe")"
          mkdir -p "$subj/.ductus"
          cd "$subj"
          git init -q -b main
          git config user.name scratch
          git config user.email scratch@example.invalid
          printf '# scratch\n' > README.md
          git add README.md
          git commit -q -m initial
          {
            printf '[project]\nname = "scratch"\ndescription = "A scratch adopter for testing ductus."\nlanguages = ["TypeScript"]\n\n'
            printf '[rules]\nsurfaces = ["backend"]\n\n'
            printf '[runtime]\npath = "%s"\n' "$bin"
          } > .ductus/config.toml
          cat .ductus/config.toml
          sh "$GITHUB_WORKSPACE/install.sh" claude --ref=main
          echo "SUBJECT=$subj" >> "$GITHUB_ENV"

      - name: Run /ductus in Claude Code
        shell: bash
        timeout-minutes: 50
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          test -n "$ANTHROPIC_API_KEY" || { echo "the ANTHROPIC_API_KEY secret is not set" >&2; exit 1; }
          cd "$SUBJECT"
          claude -p "/ductus --agents=claude --ref=main" \
            --model claude-sonnet-5-5 \
            --permission-mode bypassPermissions \
            --output-format stream-json --verbose \
            --append-system-prompt "No operator is present in this run. Where the bootstrap asks the operator, use the value .ductus/config.toml records, else the procedure's stated default, and consent to every migration it proposes. Do not commit." \
            > "$RUNNER_TEMP/session.jsonl"
          echo "claude exit: $?"

      # Prints each .json file the session wrote and each runtime call that
      # passed one, with its result, which is what task 32 records. Fails only
      # when the session never reached apply-manifest, so a run that measured
      # nothing cannot read as one that measured.
      - name: What the session wrote and what the runtime returned
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/record.py" << 'EOF'
          import json, sys
          calls, results = {}, {}
          final = None
          for line in open(sys.argv[1], encoding="utf-8"):
              line = line.strip()
              if not line:
                  continue
              event = json.loads(line)
              if event.get("type") == "result":
                  final = event.get("result")
              for item in (event.get("message") or {}).get("content") or []:
                  if not isinstance(item, dict):
                      continue
                  if item.get("type") == "tool_use":
                      calls[item["id"]] = (item.get("name"), item.get("input") or {})
                  elif item.get("type") == "tool_result":
                      body = item.get("content")
                      if isinstance(body, list):
                          body = "\n".join(b.get("text", "") for b in body if isinstance(b, dict))
                      results[item["tool_use_id"]] = (bool(item.get("is_error")), str(body))
          manifest_calls = 0
          for cid, (name, args) in calls.items():
              target = args.get("file_path", "")
              command = args.get("command", "")
              if name in ("Write", "Edit") and target.endswith(".json"):
                  print(f"--- {name} {target}")
              elif name == "Bash" and "-json" in command:
                  if "apply-manifest" in command or "enforce-manifest" in command:
                      manifest_calls += 1
                  error, body = results.get(cid, (None, "(no result)"))
                  print(f"--- Bash (error: {error})\n{command}\n{body[:3000]}")
          print("--- final message")
          print(final)
          print(f"--- manifest calls passing a json file: {manifest_calls}")
          sys.exit(0 if manifest_calls else 1)
          EOF
          test -s "$RUNNER_TEMP/session.jsonl" || { echo "the session wrote no transcript" >&2; exit 1; }
          python "$RUNNER_TEMP/record.py" "$RUNNER_TEMP/session.jsonl"
          cd "$SUBJECT"
          git status --porcelain

      - name: Keep the transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-agent-session
          path: ${{ runner.temp }}/session.jsonl
          retention-days: 14
