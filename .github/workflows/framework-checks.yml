name: framework-checks

# Framework-wide checks on every pull request and every push to main:
# generators, lints, procedure parseability, shell static analysis, and the
# self-audit.
#
# No `paths:` filter, on purpose: spec 026 runs the self-audit on every pull
# request. Its families read far past `framework/` and `specs/` — the audit
# scripts themselves, runtime sources, the README — and step (j) lints every
# tracked shell script, so a filter naming the files that "matter" is a
# second list of those subjects, and the change it forgets is the one that
# merges unchecked.
#
# This workflow used to open with the constitution's **opt-in invariant** —
# a step asserting no runtime binary was on PATH, proving the markdown-only
# path completed without one. Spec 048 made the runtime required and
# replaced that invariant with the **acquisition invariant**, which is
# asserted by runtime-acquisition.yml. The step was removed rather than the
# file: the other checks here were never part of the invariant, and
# deleting the workflow would have dropped markdownlint, frontmatter, the
# rule lints, parseability, and the self-audit along with it.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  framework-checks:
    name: Framework generators, lints, and self-audit
    runs-on: ubuntu-latest
    # Bounds the whole job (BE-TIMEOUT-001); 022's plan, Release workflow,
    # gives the sizing.
    timeout-minutes: 15
    steps:
      # Full history, for Family 10's check 10d (scripts/audit/migration-coverage.sh):
      # it orders the registry's entries by the commit that first held each, so
      # a depth-1 clone cannot run it (it reports a shallow checkout as a
      # finding, never a pass). Family 19 needed full history until spec 081
      # retired it; measured at debcc8cf, the other steps this job runs pass in
      # a depth-1 clone. The families that call `dashboard` read only its spec
      # inventory, through lib.sh's spec_corpus, and never its reopenings and
      # inbox-age fields, which read history.
      # A step whose result comes to depend on history needs `fetch-depth: 0`
      # and a comment naming it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Node is the runner image's own, not a download (owner decision,
      # 2026-10-20, 022 task 3). setup-node fetched it with no checksum check,
      # from a version manifest read off a branch, which SEC-DEPS-001 does not
      # allow; the image's Node, like its shellcheck and jq, moves when GitHub
      # updates the image.
      #
      # Installs the pinned markdownlint-cli2 from package-lock.json. Without
      # it, step (c)'s `npx` would fetch whatever is latest that day, so the
      # version CI enforces could differ from the one the manifest records —
      # a pin nothing honors is worse than no pin, since it reads as a
      # guarantee. `npm ci` fails on a lockfile that disagrees with
      # package.json, which is the property wanted here.
      - name: Install pinned lint tooling
        run: npm ci

      # BE-DEPS-004: a package pulled from a public registry is verified
      # against a signature before it is used. npm's `audit signatures`
      # checks each installed package's registry signature (npm's key) and
      # any provenance attestation, and exits non-zero when a registry
      # signature is missing or invalid or an attestation fails to verify,
      # so an unsigned package fails the step here.
      - name: Verify the lint tooling's registry signatures
        run: npm audit signatures

      # BE-DEPS-001: a dependency with a known high or critical vulnerability
      # is updated, replaced, or has a documented exception. npm's own
      # --audit-level fails this step on any high or critical advisory in the
      # installed tree, so a new one fails a run instead of waiting for someone
      # to read a log (022 task 13, the owner's answer (c), 2026-11-12).
      # package.json's overrides entry moves markdownlint-cli2 0.24.0's
      # markdownlint from 0.42.0 to 0.42.1, whose re2js 2.9.1 fixes
      # GHSA-gg6h-894w-4m9c; 022's plan, Provenance, says when it goes.
      - name: The lint tooling carries no high or critical advisory
        run: npm audit --audit-level=high

      # The two frontmatter derivations are runtime primitives since spec
      # 067's adopter-generator-promotion, so this step needs the binary and
      # the toolchain block below has to precede it. Step (f) reuses the same
      # build as a cache-warm no-op.
      # Pinned — keep in sync with runtime/rust-toolchain.toml.
      # `components` must match the toolchain file: any cargo command run
      # under runtime/ makes rustup honor rust-toolchain.toml, and if the
      # declared components are missing it auto-installs them mid-build —
      # a path that hits rustup's "detected conflict: 'bin/cargo-fmt'" bug.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      # Keyed on what the binary is compiled from, so an unchanged runtime
      # restores a build of exactly these sources (spec 081). runtime/src holds
      # no include_str! or include_bytes!, and the crate has no build.rs.
      - id: runtime-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ runner.os }}-runtime-parseability-${{ hashFiles('runtime/Cargo.lock', 'runtime/Cargo.toml', 'runtime/rust-toolchain.toml', 'runtime/src/**') }}
          restore-keys: |
            ${{ runner.os }}-runtime-parseability-
      # The checkout gives every source a newer mtime than the restored build,
      # which cargo reads as a change. On an exact hit that build is of these
      # very sources, so dating them back lets every `cargo build` in this job
      # find it fresh, and a spec-only push compiles nothing. Never on a
      # fallback restore: that build is of other sources, and dating those back
      # would hand the steps a stale binary.
      - name: Reuse the cached build of these runtime sources
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: git ls-files -z runtime | xargs -0 touch -t 200001010000
      - name: Build the runtime
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != "true" ]; then
            echo "No build of these runtime sources is cached, so this run compiles one."
          fi
          cd runtime && cargo build --release --locked --quiet

      - name: (b) Generators and derived indexes are in sync
        run: |
          # Report-only by default — the primitives never write without
          # --write — and they exit non-zero when the committed indexes are
          # stale, which is exactly this check.
          ./runtime/target/release/ductus derive-dependencies
          ./runtime/target/release/ductus derive-references
          bash scripts/gen-help-tables.sh --dry-run

      - name: (c) markdownlint passes
        run: npx markdownlint-cli2

      # (d) Every command that names a runtime tool carries the
      # §runtime-host-integration pointer (spec 021, repurposed by 048). The lint
      # is the only check of that rule, so its test runs beside it and shows it
      # fails on each case it claims to catch.
      - name: (d) Tool-coverage lint passes
        run: |
          bash scripts/lint-tool-coverage.sh
          bash scripts/tests/test-lint-tool-coverage.sh

      - name: (e) Frontmatter integrity
        run: bash scripts/lint-frontmatter.sh

      - name: (g) Rule filename suffix lint
        run: bash scripts/lint-rule-filenames.sh

      - name: (i) Rule-ID grammar lint
        run: bash scripts/lint-rule-ids.sh

      # (k) The release pipeline must attempt the irreversible half first: the
      # crates.io publish, which can be yanked but never unpublished, before the
      # GitHub release, which can be deleted and recreated. Three releases
      # shipped half-released before that ordering landed (spec 048,
      # scenarios/release-halves-publish-together.md), and each was recovered by
      # hand. The guarantee is one `needs:` edge in a workflow that only ever
      # runs on a tag push, so nothing exercises it until a release is already
      # half out the door — which is exactly the case for asserting it on every
      # PR instead. Its own test suite runs alongside, because a guard for a
      # silent failure is worth nothing unless it is shown to fail.
      # The tag check that ordering places before the publish (spec 048, AC15)
      # also runs only on a tag, so its test runs here too.
      - name: (k) Release ordering
        run: |
          bash scripts/lint-release-ordering.sh
          bash scripts/tests/test-lint-release-ordering.sh
          bash scripts/tests/test-check-release-tag.sh

      # (l) The installer is piped to `sh` by people who cannot see its logic,
      # and each check it makes on the source (spec 061) guards a silent
      # outcome: a bootstrap from the wrong release, or a file written for a
      # ref that should have halted. The test runs it against a stubbed curl,
      # under the runner's /bin/sh (dash), so a bashism fails here rather than
      # on an adopter's machine.
      - name: (l) Installer source resolution
        run: bash scripts/tests/test-install.sh

      # (m) The weekly currency run is the update process for the CI pins
      # (SEC-DEPS-001, 022 task 3), and it runs on a schedule, not on push, so a
      # comparison that stopped comparing would read as current for weeks.
      # The test drives the pins check against stubbed lookups and shows it
      # fails on each case it claims to catch.
      - name: (m) Pins currency check
        run: bash scripts/tests/test-check-runtime-currency.sh

      # (n) The configure generator runs on every commit through the
      # pre-commit hook and rewrites four shipped permission files. Its test
      # shows the four in sync and that a swapped or repeated marker is
      # refused with the file left as it was, where the splice would
      # otherwise delete lines.
      - name: (n) Configure generator
        run: bash scripts/tests/test-gen-configure-mcp.sh

      # (o) AGENTS.md and the constitution have size ceilings (spec 072) so a
      # lesson added past one retires another instead of growing the rulebook.
      # The hook runs the lint on staged blobs; this catches a --no-verify
      # commit. Its test shows the lint fails over a ceiling, on a missing or
      # unreadable file, and passes at and under one.
      - name: (o) Governing-document size ceilings
        run: |
          bash scripts/lint-governing-size.sh
          bash scripts/tests/test-lint-governing-size.sh

      # (p) Family 40 holds a deprecated rule to the release its label names
      # (spec 026, scenario family-40-deprecated-rules-are-removed-on-time).
      # Step (h) runs it over the tree, where it reports nothing until a
      # removal target is reached, so a comparison that stopped comparing
      # would pass there for releases. The test builds fixture trees, each given
      # the runtime built above, and shows the family fails on each case it
      # claims to catch.
      - name: (p) Deprecated rules are removed on time
        run: bash scripts/tests/test-deprecation-removal.sh

      # (q) Family 17 resolves the namespace the runtime renders as
      # `Host::load` does, which halts on a config that does not parse.
      # Step (h) runs the family over this repository, whose config parses,
      # so a family that fell back to the directory basename again would
      # pass there. The test builds fixture trees and shows the family fails,
      # naming the file, on an unparseable config whose basename matches.
      - name: (q) Host namespace resolution halts on an unparseable config
        run: bash scripts/tests/test-host-namespace-parity.sh

      # (r) The repository's pre-commit hook generates from the commit's index,
      # so another session's unstaged work in the same tree is not committed
      # or overwritten (spec 017, a-commit-stages-only-its-own-generated-files).
      # The test builds fixture repositories carrying the hook and the
      # generators, and drives the runtime built above, so it needs that build
      # and shells out to scripts/gen-*.sh and .githooks/pre-commit.
      - name: (r) Pre-commit hook stages only its own generated files
        run: bash scripts/tests/test-pre-commit-staging.sh

      # (s) Family 10's check 10d holds the migration registry's sort order
      # against the order entries were added (spec 027 task 15). Step (h) runs
      # it over this repository's history, where it passes until an entry
      # sorts earlier than one added before it, so a check that stopped
      # comparing would pass there. The test builds fixture repositories with
      # their own history and shows the check fails on each case it claims to
      # catch, a shallow clone included.
      - name: (s) Migration registry sort order against history
        run: bash scripts/tests/test-migration-coverage.sh

      # (j) The shell surface is the framework's own machinery — the audit
      # families that form the release gate, the generators, the lints, the
      # installer and the hooks. The Rust half has been gated at
      # `clippy -D warnings` since spec 022, but nothing linted the shell,
      # even though a tuned .shellcheckrc was committed: a green
      # framework-checks run could not distinguish "the scripts are clean"
      # from "the scripts were never examined". That is the exact shape
      # framework/constitution.md §design-principles forbids, and it is how
      # sibling-coupling.sh shipped a GNU-awk extension that silently
      # disabled a release gate on every macOS machine.
      #
      # The enumeration is asserted non-empty before the run: an unmatched
      # glob or a moved directory would otherwise lint nothing and pass,
      # reintroducing the same false green this step exists to close.
      - name: (j) Shell static analysis
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1 || {
            echo "::error::shellcheck is not available — this step cannot examine its subject, which is not the same as clean" >&2
            exit 1
          }
          # No `mapfile`/`readarray`: bash 3.2 (every macOS machine) lacks
          # both, and a contributor must be able to run this step verbatim
          # before pushing rather than discovering it only in CI.
          files="$(
            git ls-files -- '*.sh' '.githooks/*' 'framework/bootstrap/hooks/*' \
              | grep -vE '^runtime/tests/fixtures/'
          )"
          count="$(printf '%s\n' "$files" | grep -c . || true)"
          if [ "$count" -eq 0 ]; then
            echo "::error::no shell scripts matched — the enumeration is broken, not the tree" >&2
            exit 1
          fi
          echo "linting $count shell script(s)"
          printf '%s\n' "$files" | xargs shellcheck -S warning

      # Step (f) invokes the runtime binary built above via a *relative path*.
      # Build with --locked here so a stale Cargo.lock fails loudly; the
      # script's own `cargo build --release` then becomes a cache-warm
      # no-op against the same target dir.
      - name: (f) Procedure parseability
        run: |
          (cd runtime && cargo build --release --locked --quiet)
          bash scripts/lint-procedure-parseability.sh

      # Step (h) runs the framework self-audit (spec 026). The v1
      # advisories (Family 4 placeholder-roundtrip, Family 8 introducing-
      # drift, Family 9 primitive-promotion candidates) were resolved in
      # commit 1aca768. Per spec 026 §Q4 and the audit-ci-hard-gate
      # scenario, this step is now a hard PR gate: any finding fails the
      # check. To deliberately allow a finding, use the documented
      # ignore-marker annotations (audit:ignore-placeholders,
      # audit:ignore-promotion, etc.) inside the affected source.
      - name: (h) Framework self-audit
        run: bash scripts/audit/run-all.sh
