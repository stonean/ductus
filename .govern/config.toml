[host]
# The slash-command namespace, shared across the team and committed. Without
# it `Host::load` falls back to the repo directory basename — `govern` — and
# every rendered next-action names `/govern:…`, a namespace that does not
# exist here: the commands are installed at `.claude/commands/gov/`.
# Family 17 of `/gov:audit` (host-namespace-parity) enforces the agreement.
project = "gov"

[review]
tech-stack-verified = true
