# ductus generators and policy gates — adopter CI template.
#
# Copy this file into your repository at .github/workflows/ductus-generators.yml
# to enforce that ductus's invariants stay intact on every PR. GitHub reads
# workflows only from the repository's root, so a project that is a
# subdirectory of its repository puts the file there too and sets the job's
# working directory below. Two classes of check run:
#
#   1. Generator sync — generated frontmatter (spec `dependencies:` and
#      `references:`, via `ductus derive-dependencies` and
#      `ductus derive-references`) must match its sources. Safety net for
#      contributors who never installed the local pre-commit hook
#      (.githooks/pre-commit, set up by /ductus).
#
#   2. Audit-record gate — every spec at `status: done` must carry a review
#      record in `review.md` and an analyze record in `analysis.md`, each
#      with a non-null `last-run` and `blocking: false`, as
#      `ductus check-audit-records` reads them (spec 085). The local
#      `/ductus:implement` halt and `/ductus:analyze` drift check catch this
#      pre-merge; this step catches bypasses (direct frontmatter edits).
#
#      A spec with **no** `review.md` or no `analysis.md` has never been
#      reviewed or analyzed. That set is exempt but **bounded**: the counts
#      are held against high-water marks you commit at
#      `.ductus/audit-record-baseline.txt`, defaulting to zero when the file
#      is absent. The set cannot legitimately grow — `check-review-gate` has
#      no grandfather clause, so nothing reaches `done` without both records
#      — and an unbounded exemption is how the previous version of this step
#      went vacuous: it skipped any spec whose `spec.md` frontmatter had no
#      `review:` block, which ductus 0.50.0 made true of every spec.
#
#   3. Owed work and unreviewed code (spec 084) — no spec at `status: done`
#      holds an unchecked box in `tasks.md` or an unticked criterion, and no
#      code is left that no review is going to read, as the pre-push hook
#      (.githooks/ductus-pre-push) reports it. `[review] unreviewed-push`
#      governs the second here as it does the hook.
#
# When new adopter-relevant checks are added by future ductus releases, this
# template gains a step for each. /ductus neither installs nor updates it (CI
# files would need platform detection beyond ductus's scope), so re-copy it
# from the ductus repository to pick up a change.

name: ductus-generators

on:
  # No `paths:` filter, deliberately. GitHub evaluates `on.paths` before any
  # job runs, so it cannot read the configured spec root the way the runtime
  # the steps below run does ([paths] specs-root, spec 040). A hardcoded
  # 'specs/**' silently disables BOTH gates for every adopter who renamed
  # their spec root — the workflow simply never triggers, which reads as a
  # clean CI rather than an absent one. Running on every PR is the cheaper
  # error: a gate that cannot run must never look like one that passed.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: ductus generators are in sync
    runs-on: ubuntu-latest
    # A project that is a subdirectory of its repository sets its path here,
    # so every `run` step starts from the project root, where `.ductus/` and
    # the spec root live (spec 059). Without it the derive step runs from the
    # repository root and finds no project there. The checkout is a `uses`
    # step and is not affected.
    # defaults:
    #   run:
    #     working-directory: path/to/project
    steps:
      # Full history: the unreviewed-code step reads where each `done` spec's
      # review window and the project record's start, which a checkout of the
      # default depth of 1 stops before. The check reports a shallow history
      # as not examined, never as clean, so without this the step fails under
      # "block" on every run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The steps below run the ductus runtime, and a checkout carries none:
      # /ductus keeps it in a per-machine store and links it from
      # `.ductus/bin/`, which is gitignored. So this step downloads the
      # release binary, pinned by version and by the sha256 of its archive
      # (SEC-DEPS-001), and checks the hash before anything runs. No Rust
      # toolchain is needed. The archive is the x86_64 Linux one an
      # ubuntu-latest runner uses; on another architecture the verified
      # binary will not execute, and running it fails the step before any
      # version is compared.
      # To move to a newer release, re-copy this template, or set
      # DUCTUS_VERSION to that release's version and DUCTUS_SHA256 from its
      # `ductus-x86_64-unknown-linux-gnu.tar.gz.sha256` asset.
      #
      # The download is bounded (BE-TIMEOUT-001) and not retried: a failed
      # one fails the job, which can be re-run.
      - name: Install the ductus runtime
        timeout-minutes: 10
        env:
          DUCTUS_VERSION: 0.64.0
          DUCTUS_SHA256: 4c5113f8e16adc69ffae949e0a028949546f5c5ad043c348bb8d0ab37a53878d
          DOWNLOAD_CONNECT_TIMEOUT_SECONDS: "30"
          DOWNLOAD_MAX_TIME_SECONDS: "300"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ductus-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            --connect-timeout "$DOWNLOAD_CONNECT_TIMEOUT_SECONDS" --max-time "$DOWNLOAD_MAX_TIME_SECONDS" \
            "https://github.com/stonean/ductus/releases/download/ductus-v${DUCTUS_VERSION}/ductus-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$DUCTUS_SHA256" "$archive" | sha256sum -c -
          bin="$RUNNER_TEMP/ductus-bin"
          mkdir -p "$bin"
          tar -xzf "$archive" -C "$bin" ductus
          reported="$("$bin/ductus" --version)"
          case "$reported" in
            *"$DUCTUS_VERSION"*) ;;
            *)
              echo "::error::the downloaded runtime reports '$reported', expected $DUCTUS_VERSION"
              exit 1
              ;;
          esac
          # Outside the work tree, so the sync check below cannot see it.
          printf '%s\n' "$bin" >> "$GITHUB_PATH"

      - name: Derive generated frontmatter
        run: |
          set -euo pipefail
          # Both derivations, not only `dependencies:`. `references:` drifts
          # without anyone editing a spec — renaming a service in the registry
          # restates every spec pointing at it — so deriving one and reporting
          # "generators are in sync" asserts a property never checked
          # (QUAL-CLAIM-001, whose own record is an adopter carrying dead
          # references for nine commits behind exactly this gap).
          ductus derive-dependencies --write
          ductus derive-references --write

      - name: Fail if any derivation produced a diff
        run: |
          # `git status --porcelain`, not `git diff --exit-code`: the latter
          # ignores untracked files, so a derivation that creates a new output
          # reports in sync over a stale tree.
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::Generated frontmatter is out of sync with body links. Run /ductus to install the pre-commit hook, or run 'ductus derive-dependencies --write' and 'ductus derive-references --write' locally and re-commit."
            printf '%s\n' "$dirty"
            git diff
            exit 1
          fi

      - name: Audit-record gate on done specs
        # `ductus check-audit-records` reads every spec at `status: done`: its
        # review record from `review.md` and its analyze record from
        # `analysis.md`, by the completion gate's own read and parse (spec
        # 085), so this step parses no frontmatter of its own. Each must
        # carry a non-null `last-run` and `blocking: false`. Catches the
        # bypass case where someone edits frontmatter directly to set `done`
        # without running /ductus:review and /ductus:analyze.
        #
        # Each record has three states and they are never collapsed: the
        # artifact is **absent** (never run), **present** (checked), or
        # present and **unparseable** (undeterminable, which is a finding —
        # a file nothing can read must not pass as a file that was read).
        # A record with no `blocking` field is a finding too: absent is not
        # false.
        #
        # The never-run set is exempt and bounded by the committed high-water
        # marks in `.ductus/audit-record-baseline.txt`, in the ratchet form
        # `/ductus:audit`'s analyze-record family already uses, and a malformed
        # file is a finding. That bound is the whole point: the predicate this
        # step used to skip on — no `review:` block in `spec.md` frontmatter
        # — became true of every spec at the relocation, so the step would
        # have gone green across a whole corpus while checking nothing.
        #
        # The check reports on stderr what it examined, how many specs are at
        # done and each exempt count with its mark, clean runs included, and
        # exits 1 on a finding, or when it examined no spec, which is not the
        # same as passing. A spec root it cannot list is an error, never zero
        # specs examined.
        run: |
          set -euo pipefail
          # GitHub resolves an annotation's `file=` from the repository root,
          # while this step runs from the project root and the check names
          # files from there. The project's path from the work tree (empty at
          # the root) joins the two, so an annotation lands on its file when
          # the job sets a working directory (spec 059).
          prefix="$(git rev-parse --show-prefix)"
          report="$(mktemp)"
          code=0
          ductus check-audit-records > /dev/null 2> "$report" || code=$?
          cat "$report" >&2
          annotated=0
          while IFS= read -r line; do
            case "$line" in
              "check-audit-records: finding: "*)
                rest="${line#check-audit-records: finding: }"
                message="${rest#*: }"
                printf '::error file=%s%s::Audit-record gate: %s\n' \
                  "$prefix" "${rest%%: *}" "${message//"%"/%25}"
                annotated=$((annotated + 1))
                ;;
              "check-audit-records: nothing examined: "*)
                message="${line#check-audit-records: }"
                printf '::error::Audit-record gate: %s\n' "${message//"%"/%25}"
                annotated=$((annotated + 1))
                ;;
            esac
          done < "$report"
          if [ "$code" -ne 0 ] && [ "$annotated" -eq 0 ]; then
            echo "::error::Audit-record gate: ductus check-audit-records failed (exit $code) — see its error above"
          fi
          exit "$code"

      - name: Done specs owe no work
        # A `done` spec is `in-progress` exactly while its `tasks.md` holds an
        # unchecked box or its `spec.md` an unticked acceptance criterion (spec
        # 084), and the command that leaves it owing work reopens it; this
        # catches a hand edit that did not. `ductus check-owed-work --all` reads
        # every `done` spec by that one test. A spec it could not judge fails
        # the step too, since one nothing read must not pass as one that owes
        # nothing; one git does not track is counted and skipped.
        run: |
          set -euo pipefail
          result="$(mktemp)"
          ductus check-owed-work --all > "$result"
          python3 - "$result" <<'PY'
          import json
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          lists = result
          if result.get("form") == "file":
              lists = json.load(open(result["lists-file"], encoding="utf-8"))
          failures = 0
          for spec in lists.get("specs", []):
              for box in spec["unchecked-boxes"]:
                  print("::error::done spec %s: tasks.md holds an unchecked box: %s" % (spec["feature"], box["line"]))
                  failures += 1
              for criterion in spec["unticked-criteria"]:
                  print("::error::done spec %s: criterion %s is unticked: %s" % (spec["feature"], criterion.get("label") or "(unlabelled)", criterion["text"]))
                  failures += 1
          untracked = 0
          for skip in lists.get("skipped", []):
              if skip["reason"] == "untracked":
                  untracked += 1
              else:
                  print("::error::%s could not be judged (%s), which is not the same as owing nothing" % (skip["feature"], skip["reason"]))
                  failures += 1
          print("check-owed-work examined %d done spec(s); %d untracked skipped." % (result["examined-count"], untracked))
          if failures:
              print("Tick what is done, or set the spec to in-progress and finish it.")
          sys.exit(1 if failures else 0)
          PY

      - name: No code is left unreviewed
        # `ductus check-unreviewed-code` reports the code no review is going to
        # read: code a `done` spec claims, or that no spec claims, changed by a
        # commit no committed review covers (spec 084). It reads `[review]
        # unreviewed-push` from .ductus/config.toml as the pre-push hook does,
        # and its exit status is the step's: under "block", the default, the
        # step fails on reported code and on a subject the check could not
        # examine; under "warn" it passes with a warning per reported path and
        # per subject not examined; any other value fails naming the key. It
        # reads history, hence the full checkout above.
        run: |
          set -euo pipefail
          report="$(mktemp)"
          code=0
          ductus check-unreviewed-code > /dev/null 2> "$report" || code=$?
          cat "$report" >&2
          if [ "$code" -eq 0 ]; then
            sed -n -e 's/%/%25/g' \
              -e 's/^check-unreviewed-code:   \(.*\)$/::warning::no committed review covers \1/p' \
              -e 's/^check-unreviewed-code: \(.* was not examined: .*\)$/::warning::\1/p' "$report"
          fi
          exit "$code"
