# framework/migrations.toml — adopter-cleanup registry.
#
# One [[migrations]] entry per active convention removal. Each entry's
# procedure body lives at `framework/migrations/{id}.md`. The bootstrap
# procedure in `framework/bootstrap/ductus.md` iterates this file on every
# `/ductus` run and applies entries newer than the adopter's active config
# `[migrations].last_applied` field.
#
# See spec 027 — Bootstrap Migration Registry for the governing pipeline:
#   specs/027-bootstrap-migration-registry/spec.md
#
# Sunsetted entries are removed from this file and appended to
# CHANGELOG.md at the repo root.
#
# Ordering: by `introduced_in` SemVer ascending, lexicographic tie-break
# on `id`. File order in this TOML is not authoritative — the bootstrap
# loop sorts on read.
#
# SCOPE — an entry applies ONCE PER REPOSITORY, not once per contributor.
# `[migrations].last_applied` lives in the committed `.ductus/config.toml`,
# so the first contributor to run `/ductus` applies the pending entries and
# commits the advanced marker; everyone who pulls afterwards reads it, sees
# nothing pending, and skips. That is correct for repo-shared state.
#
# The rule that follows is about remedy, not about paths: a migration MUST
# NOT be the sole remedy for a defect in per-contributor (gitignored) state.
# Touching such state is fine when a skipped contributor self-heals through
# ordinary use — `session-file-consolidate` and `ductus-rename` both move a
# session file, and the next `/{project}:target` writes the active path
# anyway — but a cleanup that nothing else would ever perform reaches one
# person and is then marked done for the whole repo, permanently.
#
# A cleanup that must reach every contributor belongs on the command that
# owns the per-contributor file, which runs per-contributor and can be
# idempotent. Worked example: `/ductus:configure` step 4 retires
# formerly-canonical permission entries from the gitignored
# `{cli-config-dir}/settings.local.json` (spec 023). Note that
# `{config_dir}/commands/` is repo-shared despite living under `.claude/` —
# the shipped `.gitignore` excepts it — so `workflows-sunset` is not a
# counter-example.

[[migrations]]
id = "gitignore-marker-rename"
introduced_in = "0.2.0"
sunset_after = "0.10.0"
summary = "Replace # Governance marker in .gitignore with # govern"
target_paths = [".gitignore"]
procedure_file = "framework/migrations/gitignore-marker-rename.md"

[[migrations]]
id = "governance-config-rename"
introduced_in = "0.2.0"
sunset_after = "0.10.0"
summary = "Rename .governance.toml → .govern.toml in the project root"
target_paths = [".governance.toml"]
procedure_file = "framework/migrations/governance-config-rename.md"

[[migrations]]
id = "spec-and-plan-sunset"
introduced_in = "0.5.0"
sunset_after = "0.10.0"
summary = "Rename specs/*/spec-and-plan.md → specs/*/spec.md (lightweight-track sunset)"
target_paths = [
  "specs/*/spec-and-plan.md",
  "framework/templates/spec/spec-and-plan.md",
]
procedure_file = "framework/migrations/spec-and-plan-sunset.md"

[[migrations]]
id = "rule-files-relocate"
introduced_in = "0.6.0"
sunset_after = "0.10.0"
summary = "Relocate rule files from specs/ root to specs/rules/ (subsumes configuration.md rename)"
target_paths = [
  "specs/configuration.md",
  "specs/*-backend.md",
  "specs/*-frontend.md",
  "specs/*-cross.md",
]
procedure_file = "framework/migrations/rule-files-relocate.md"

[[migrations]]
id = "session-file-consolidate"
introduced_in = "0.10.0"
summary = "Consolidate {config_dir}/{project}-session.json (host/project-specific JSON) onto .govern.session.toml (repo root, gitignored, host-agnostic)"
target_paths = [
  "{config_dir}/{project}-session.json",
]
procedure_file = "framework/migrations/session-file-consolidate.md"

[[migrations]]
id = "govern-dir-consolidate"
introduced_in = "0.22.0"
# No sunset_after: high-impact directory reorg kept active indefinitely (like
# session-file-consolidate), so any adopter still on the old root layout is
# converged on their next /ductus run. The runtime keeps the legacy-path
# fallback indefinitely to match (spec 042).
summary = "Consolidate .govern.toml/.govern.session.toml and the adopter-facing generators under a .govern/ directory (.govern/config.toml, .govern/session.toml, .govern/scripts/)"
# Adopter-relative paths only (no framework/ prefix): ductus's own generators
# relocate to .ductus/scripts/ as a source move (dogfooding), which is not a
# registry-tracked removal, so /audit Family 10b does not assert on these.
target_paths = [
  ".govern.toml",
  ".govern.session.toml",
  "scripts/gen-spec-deps.sh",
  "scripts/gen-cross-service-refs.sh",
  "scripts/lib/specs-root.sh",
]
procedure_file = "framework/migrations/govern-dir-consolidate.md"

[[migrations]]
id = "constitution-relocate"
introduced_in = "0.24.0"
# No sunset_after: high-impact layout move kept active indefinitely (like
# govern-dir-consolidate), so any adopter still carrying the root
# constitution.md is converged on their next /ductus run. No runtime fallback
# exists to pair with it — no primitive reads the constitution; the shipped
# command bodies are rescaffolded to the new path in the same /ductus run
# (spec 044).
summary = "Relocate the shipped constitution from the adopter repo root to .govern/constitution.md, re-pointing the CLAUDE.md import, AGENTS.md/README.md links, and any [pinned] entry"
target_paths = [
  "constitution.md",
]
procedure_file = "framework/migrations/constitution-relocate.md"

[[migrations]]
id = "ductus-rename"
introduced_in = "0.28.0"
# No sunset_after: like govern-dir-consolidate and constitution-relocate, a
# high-impact rename kept active indefinitely so any adopter still carrying the
# retired name is converged on their next /ductus run. The runtime keeps the
# .govern/ fallback tier to match (spec 049).
summary = "Rename the project from govern to ductus: .govern/ → .ductus/, the gvrn MCP server key and command, the per-agent runtime permission entries, the installed bootstrap entry point, the pre-commit hook and its invoker, and the # govern / # govern (host) managed-block markers"
# Adopter-relative paths only. The settings and MCP files are per-agent and
# resolved from the registry at run time, so they are not enumerable here.
target_paths = [
  ".govern/",
  ".mcp.json",
  ".gitignore",
  ".githooks/govern-pre-commit",
  "CLAUDE.md",
  "AGENTS.md",
  "README.md",
]
procedure_file = "framework/migrations/ductus-rename.md"

[[migrations]]
id = "criterion-label-backfill"
introduced_in = "0.28.0"
# No sunset_after: an adopter adopting for the first time years from now still
# arrives with an unlabelled corpus, so the entry stays active indefinitely
# (spec 013). It sorts first among the 0.28.0 entries by the lexicographic
# tie-break, which is harmless — it touches spec bodies, the other two touch
# config, MCP registration, and installed files.
summary = "Assign stable AC{n} labels to every unlabelled acceptance criterion and record the next-criterion counter, so citing a criterion never requires counting a list"
target_paths = [
  "specs/*/spec.md",
]
procedure_file = "framework/migrations/criterion-label-backfill.md"

[[migrations]]
id = "runtime-store-path"
introduced_in = "0.28.0"
# No sunset_after: an adopter who has not re-bootstrapped since the runtime
# moved into the ductus-owned store still registers the bare command, and the
# entry is what repoints them (spec 048). Ordered after ductus-rename by the
# lexicographic tie-break on equal introduced_in, which is the order they must
# run in: that one renames the key and command, this one rewrites the path.
summary = "Repoint the ductus MCP registration from the bare command to the ductus-owned path — the repo-relative pointer for a project-committed config, the absolute store path for a home-level one"
target_paths = [
  ".mcp.json",
  "opencode.json",
]
procedure_file = "framework/migrations/runtime-store-path.md"

[[migrations]]
id = "workflows-sunset"
introduced_in = "0.23.0"
sunset_after = "0.25.0"
summary = "Remove scaffolded workflow commands, the synced workflows/registry.json, and the [workflows] config section (workflows feature removed; spec 043; subsumes the archived skills-to-workflows and workflow-filename-rename migrations)"
# Adopter-relative paths drive the bootstrap loop; framework/ paths
# (when present) drive /audit Family 10's no-stale-target-paths check.
target_paths = [
  "{config_dir}/commands/{project}/workflows/",
  "{config_dir}/commands/{project}/skills/",
  "workflows/registry.json",
  "framework/workflows/",
  "framework/skills/",
]
procedure_file = "framework/migrations/workflows-sunset.md"

[[migrations]]
id = "generator-primitives"
introduced_in = "0.30.0"
# No sunset_after: an adopter carrying the retired scripts has a pre-commit
# hook whose targets no longer exist, so the entry stays active until every
# tree is converged. The removal is safe on any release because the primitives
# arrive with the runtime `/ductus` acquires in the same run.
summary = "Remove the shipped frontmatter generators — .ductus/scripts/gen-spec-deps.sh, gen-cross-service-refs.sh and lib/specs-root.sh — now that the derivations are the derive-dependencies and derive-references runtime primitives (spec 067, adopter-generator-promotion)"
target_paths = [
  ".ductus/scripts/gen-spec-deps.sh",
  ".ductus/scripts/gen-cross-service-refs.sh",
  ".ductus/scripts/lib/specs-root.sh",
]
procedure_file = "framework/migrations/generator-primitives.md"

[[migrations]]
id = "audit-record-relocate"
introduced_in = "0.50.0"
# No sunset_after. The residual block is reported by `validate-frontmatter` at
# the Blocking tier for as long as it is present, so an adopter who skips this
# window does not quietly converge — they get a finding naming this migration.
# Retiring the entry while that finding still fires would leave them with a
# defect and no documented remedy.
summary = "Move each spec's `review:` and `analyze:` frontmatter blocks into the artifacts that own them — review.md and a new analysis.md — so each audit record has one home (spec 057)"
# Adopter-relative: the sweep rewrites spec files under the configured spec
# root. Nothing under framework/ is removed by this migration, so it declares
# no framework/ target path — Family 10b reads those as paths that must no
# longer exist, and `framework/templates/spec/spec.md` very much still does.
target_paths = [
  "specs/*/spec.md",
]
procedure_file = "framework/migrations/audit-record-relocate.md"

[[migrations]]
id = "inbox-guidance-refresh"
introduced_in = "0.53.0"
# No sunset_after. The inbox is installed once with the `create` strategy and
# never rewritten, so an adopter who skips this window keeps a header telling
# every reader that review, analyze, and implement write findings there — the
# opposite of what the pipeline does — and nothing else would ever correct it.
summary = "Replace the guidance comment at the top of an existing inbox with the current template's, which documents manual capture only — no command writes findings there any more (spec 058). Every item is left byte-identical."
# Adopter-relative: the inbox under the configured spec root. Nothing under
# framework/ is removed by this migration, so it declares no framework/ target
# path — Family 10b reads those as paths that must no longer exist, and
# `framework/templates/project/inbox.md` still does.
target_paths = [
  "specs/inbox.md",
]
procedure_file = "framework/migrations/inbox-guidance-refresh.md"

[[migrations]]
id = "claude-md-import-syntax"
introduced_in = "0.60.0"
# No sunset_after. `CLAUDE.md` is skip-strategy and never rewritten, so an
# adopter who skips this window keeps `@import` lines that load nothing — no
# `AGENTS.md` at session start — and nothing else would ever correct them.
# Ordered after constitution-relocate and ductus-rename, which match the
# `@import` form and must run first in a chain.
summary = "Rewrite each `@import <path>` line in CLAUDE.md, the .ductus/constitution.md one included, to the `@<path>` form Claude Code resolves (spec 002, claude-md-template-imports-load)"
# Adopter-relative. Nothing under framework/ is removed by this migration, so it
# declares no framework/ target path — Family 10b reads those as paths that
# must no longer exist, and `framework/templates/project/claude-md.md` still
# does.
target_paths = [
  "CLAUDE.md",
]
procedure_file = "framework/migrations/claude-md-import-syntax.md"

[[migrations]]
id = "constitution-import"
introduced_in = "0.60.0"
# No sunset_after. `CLAUDE.md` is skip-strategy and never rewritten, so an
# adopter who skips this window starts every Claude Code session without the
# constitution, and nothing else would ever add the line.
# Runs after claude-md-import-syntax: the two share introduced_in, and
# `constitution-import` sorts after it on the id tie-break (spec 027), so a
# constitution line that migration converted is found here and left alone. An
# adopter whose last_applied is claude-md-import-syntax still runs this one.
summary = "Add `@.ductus/constitution.md` to CLAUDE.md when nothing there imports the constitution, which now fits one read (spec 050, the-constitution-fits-one-read)"
# Adopter-relative. Nothing under framework/ is removed by this migration, so it
# declares no framework/ target path.
target_paths = [
  "CLAUDE.md",
]
procedure_file = "framework/migrations/constitution-import.md"
