# one directory rename away from silently moving every rendered next-action to
# a namespace that does not exist. The commands are installed at
# `.claude/commands/ductus/`, and Family 17 of `/ductus:audit`
# (host-namespace-parity) enforces the agreement.
project = "ductus"

