[host]
# The slash-command namespace, shared across the team and committed. The repo
# directory basename now agrees with it, so `Host::load`'s fallback would
# resolve the same value — but the key stays explicit: an implicit namespace is
# one directory rename away from silently moving every rendered next-action to
# a namespace that does not exist. The commands are installed at
# `.claude/commands/ductus/`, and Family 17 of `/ductus:audit`
# (host-namespace-parity) enforces the agreement.
project = "ductus"

[review]
tech-stack-verified = true

[runtime]
# This repository builds the runtime it ships, so it supplies its own binary
# rather than acquiring a published release: a maintainer's MCP calls must
# exercise the build in the working tree, not the last tagged version. The
# pointer resolves here, so `cargo build --release` plus a session restart is
# the whole loop — no `cargo install` step.
path = "runtime/target/release/ductus"
